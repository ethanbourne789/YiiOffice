version: '3'

tasks:
  frontend:
    desc: Build all renderer bundles
    dir: frontend
    cmds:
      - npm install
      - node tools/build-renderers.mjs shell docs

  test:
    desc: Run Go and frontend unit tests
    cmds:
      - go test ./...
      - npm --prefix frontend run test

  verify:
    desc: Gate G1 checks
    cmds:
      - go vet ./...
      - go test ./...
      - npm --prefix frontend run test
      - node frontend/tools/build-renderers.mjs shell docs
      - go build -tags production

  build:
    desc: Build Windows desktop binary
    deps: [frontend]
    cmds:
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o build/bin/YiiOffice.exe .

  dist:win:
    desc: Build Windows production binary
    deps: [frontend]
    cmds:
      - |
        go build -tags production -trimpath -buildvcs=false
          -ldflags "-w -s -H windowsgui -X gitee.com/ethanbourne789/yiioffice/internal/buildinfo.Version={{default '0.0.0-dev' .APP_VERSION}}"
          -o build/bin/YiiOffice.exe .

  dist:win:installer:
    desc: Build NSIS installer
    deps: [dist:win]
    cmds:
      - makensis build\windows\nsis\installer.nsi

  dev:
    desc: Run the app directly (builds frontend first, then runs Go binary)
    deps: [frontend]
    cmds:
      - wails3 dev

  e2e:
    desc: Run E2E tests against dev server
    cmds:
      - cd e2e && npx playwright test

  e2e:ui:
    desc: Run E2E tests in UI mode
    cmds:
      - cd e2e && npx playwright test --ui
