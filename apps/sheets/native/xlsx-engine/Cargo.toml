[package]
name = "xlsx-sidecar"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.23.1"
calamine = "0.37.0"
ironcalc = "0.9.1"
quick-xml = { version = "0.42", features = ["encoding"] }
roxmltree = "0.21.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
