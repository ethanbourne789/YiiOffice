name: CI

# Runs the verification chain that a release must pass: Go vet+tests+build for
# the backend, and typecheck+tests+full renderer build for the frontend.
# E2E (Playwright) drives a server build of the app (`-tags server`) so the tests
# exercise the real Go services, not a stubbed bridge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Go (vet + test + build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Bindings generation is part of the frontend build; verify the tagged
      # production build compiles cleanly so -X version injection is exercised.
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./internal/...
      - name: go build (production tags + version injection)
        # Mirrors Taskfile build: injects buildinfo.Version and compiles all Windows targets.
        run: |
          go build -tags production -trimpath -buildvcs=false `
            -ldflags="-w -s -H windowsgui -X gitee.com/ethanbourne789/yiioffice/internal/buildinfo.Version=ci" `
            -o build/bin/YiiOffice-ci.exe .

  frontend:
    name: Frontend (install + typecheck + test + build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Unit tests (all workspaces)
        run: npm test
      - name: Build all renderers
        run: npm run build
      # The frontend/dist produced here is consumed by the Go embed; sanity-check.
      - name: Verify embedded assets present
        run: powershell -Command "Get-ChildItem dist -Directory | ForEach-Object { \$_.Name }"
        shell: pwsh

  e2e:
    name: E2E (Playwright vs server build)
    runs-on: windows-latest
    # Playwright drives a server build of the app (`-tags server`): same renderer
    # bundles, same Go services, served over HTTP — the approach specified by
    # https://v3.wails.io/guides/e2e-testing/. No WebView2 and no display needed.
    # The harness launches the binary itself (one host per worker), so the
    # `webServer` block does not apply to this project.
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install chromium
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The suite drives a server build of the app, so the bindings, the
      # renderer bundles and the Go binary must be current before Playwright
      # starts (the harness launches the binary itself, one host per worker).
      # Bindings first, with the server tag, exactly as the guide prescribes.
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: Generate bindings for the server build
        run: wails3 generate bindings -ts -f '-tags=server,production' -clean=true -time-type=Date
      - name: Build renderers
        working-directory: frontend
        run: npm run build
      - name: Build E2E server binary
        run: go build -tags server,production -buildvcs=false -o build/bin/YiiOffice-e2e-server.exe .
      - name: Run Playwright E2E tests (real Go backend)
        working-directory: e2e
        run: npx playwright test --project=real
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore